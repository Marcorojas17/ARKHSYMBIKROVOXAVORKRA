<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARKHE Voz Original</title></head><body style="background:#0a0a0f;color:white;font-family:system-ui;padding:20px"><h1>🎙️ Bóveda Voz ORIGINAL - NO CLON</h1><p>Esta página graba tu voz real y la sella con SHA256. No usa TTS.</p><button id="rec" style="padding:15px;background:#7c3aed;color:white;border:0;border-radius:10px;width:100%">🔴 GRABAR</button><button id="stop" style="display:none;padding:15px;background:#ef4444;color:white;border:0;border-radius:10px;width:100%">⏹️ DETENER Y SELLAR</button><div id="lista"></div><script>let mr,chunks=[],vault=JSON.parse(localStorage.getItem('arkhe_vault')||'[]');async function sha(b){const h=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(h)).map(x=>x.toString(16).padStart(2,'0')).join('')}function render(){document.getElementById('lista').innerHTML=vault.map(r=>`<div style="border:1px solid #2a2a3a;padding:10px;margin:10px 0;border-radius:10px"><b>${r.q}</b><br><audio controls src="${r.url}"></audio><br><small>${r.hash.slice(0,20)}...</small></div>`).join('')}document.getElementById('rec').onclick=async()=>{const s=await navigator.mediaDevices.getUserMedia({audio:true});mr=new MediaRecorder(s);chunks=[];mr.ondataavailable=e=>chunks.push(e.data);mr.onstop=async()=>{const blob=new Blob(chunks,{type:'audio/webm'});const buf=await blob.arrayBuffer();const hash=await sha(buf);const url=URL.createObjectURL(blob);const r={id:crypto.randomUUID(),q:prompt('¿Qué pregunta respondiste?')||'Recuerdo',hash,type:'ORIGINAL_RECORDING',url};const reader=new FileReader();reader.onload=()=>{r.b64=reader.result;vault.push(r);localStorage.setItem('arkhe_vault',JSON.stringify(vault));render()};reader.readAsDataURL(blob)};mr.start();document.getElementById('rec').style.display='none';document.getElementById('stop').style.display='block'};document.getElementById('stop').onclick=()=>{mr.stop();mr.stream.getTracks().forEach(t=>t.stop());document.getElementById('rec').style.display='block';document.getElementById('stop').style.display='none'};render()</script></body></html>
